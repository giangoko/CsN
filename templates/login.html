{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Đăng nhập</h2>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autocomplete="username">
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    {% if require_captcha %}
      <label for="captcha">Xác thực CAPTCHA: {{ captcha_question }}</label>
      <input id="captcha" name="captcha" required autocomplete="off" inputmode="numeric">
    {% endif %}
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="muted">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a></p>
</div>
{% endblock %}
