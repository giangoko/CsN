# "Đám mây riêng" trên máy cục bộ: 3 dịch vụ trong 2 mạng ảo tách biệt.
#   frontend: proxy <-> app      backend (internal): app <-> db
# Chỉ proxy mở cổng ra máy chủ (8080). Database không thể truy cập từ bên ngoài.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?hãy đặt DB_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: security_login_db
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:?hãy đặt DB_PASSWORD trong .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: app
      DB_MANAGED: "1"
      AUTO_INIT_DB: "1"
      TRUSTED_PROXY_COUNT: "1"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [frontend]

volumes:
  dbdata: {}

networks:
  frontend: {}
  backend:
    internal: true
